name: Zoog.A.I. Ltd.
description: >-
  Zoog.A.I. Ltd. (Zoog) is a consumer application that lets families create
  personalized video books and songs for children. Parents and kids can read
  classic children's books, sing popular nursery rhymes, and turn them into
  personalized videos featuring their own family, then share those magical
  creations. Zoog is delivered as an iOS app (with an Android waitlist) and a
  companion website, and is backed by 500 Global. It has no public developer
  API surface, SDKs, or API documentation at this time; this profile captures
  its identity and web presence within the API Evangelist network.
